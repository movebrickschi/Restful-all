openapi: 3.0.3
info:
  title: Petstore F4 fixture
  version: 1.0.0
  description: Minimal OpenAPI 3.0 spec to exercise SwaggerImporter happy path.
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      description: Returns a paginated list of pets.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - name: tag
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                tag: { type: string }
      responses:
        '201':
          description: created
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get pet by id
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
    put:
      operationId: updatePet
      summary: Update pet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: ok
    delete:
      operationId: deletePet
      summary: Delete pet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer }
        - name: X-Confirm
          in: header
          required: false
          schema: { type: string }
      responses:
        '204':
          description: no content
